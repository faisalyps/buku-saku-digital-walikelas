                                        <button onClick={() => setActiveTab('sekolah')} className="group flex flex-col items-center p-6 bg-white border-2 border-yps-border rounded-xl hover:border-yps-orange hover:shadow-md transition cursor-pointer">
                                            <div className="text-yps-orange mb-3 group-hover:scale-110 transition"><Icons.ShieldAlert/></div>
                                            <h3 className="font-bold text-lg text-yps-black">Tingkat Sekolah (PK)</h3>
                                            <p className="text-sm text-gray-500">Penanganan Formal & Sanksi Tegas</p>
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-yps-border p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 rounded-lg bg-yps-lightGreen text-yps-green"><Icons.UserCheck/></div>
                                        <div>
                                            <h3 className="font-bold text-yps-black">Cek Seragam Hari Ini</h3>

                                        </div>

                                        <span className="bg-yps-lightGreen text-yps-green px-3 py-1 rounded-full whitespace-nowrap">Rabu: Kotak-kotak</span>
                                        <span className="bg-gray-100 px-3 py-1 rounded-full whitespace-nowrap">Kamis: Kaos Sekolah</span>
                                        <span className="bg-yps-lightOrange text-yps-orange px-3 py-1 rounded-full whitespace-nowrap">Jumat: Pramuka</span>
                                    </div>
                                </div>
                            </div>
                        );

                    case 'walikelas':

                            <div className="space-y-8 animate-fade-in">
                                <div className="p-6 rounded-2xl border bg-yps-lightGreen border-yps-green bg-opacity-20">

                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-lg font-bold text-yps-black">Alur Sanksi Berjenjang</h3>

                                                <p className="text-sm text-gray-600 mt-1">Siswa mengisi Lembar Refleksi Diri. Tidak ada surat ke orang tua.</p>

                                            <div className="absolute -left-[34px] w-6 h-6 rounded-full border-4 border-white shadow-sm bg-red-500"></div>

                                                <span className="text-xs font-bold px-2 py-1 rounded mb-2 inline-block bg-red-100 text-red-800">LEVEL 3</span>

                                            <h3 className="text-xl font-bold text-yps-black">PK-II</h3>
                                            <span className="px-3 py-1 rounded-full text-xs font-bold bg-yps-lightOrange text-yps-orange">Peringatan Keras</span>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-4">Eskalasi dari PK-I. Orang tua dipanggil oleh Kesiswaan/BK.</p>
                                        <div className="bg-gray-50 p-3 rounded text-xs text-gray-500"><strong>Sanksi:</strong> Tugas Literasi/Adiwiyata selama 2 hari.</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border-l-4 border-red-500 shadow-sm">
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-xl font-bold text-yps-black">PK-III</h3>
                                            <span className="bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-bold">Sidang Komdis</span>
                                        </div>
                                        <p className="text-gray-600 text-sm mb-4">Kasus ditangani Komisi Disiplin. Orang tua menghadap Wakasek Kesiswaan.</p>
                                        <div className="bg-gray-50 p-3 rounded text-xs text-gray-500"><strong>Sanksi:</strong> Skorsing edukatif 3-5 hari di sekolah.</div>
                                    </div>

                                        <div className="bg-gray-700 p-3 rounded text-xs text-gray-300"><strong>Sanksi:</strong> Dikembalikan kepada Orang Tua (Drop Out) atau Skorsing Luar 1 Bulan.</div>
                                    </div>
                                </div>
                            </div>
                        );

                                            <button onClick={() => setSelectedChapter(null)} className="font-medium hover:underline text-yps-green">Kembali ke Daftar Isi</button>
                                        </div>

                                            <h2 className="text-2xl font-bold mb-2 text-yps-black">Buku Saku Digital</h2>
                                            <p className="text-gray-600">Baca aturan sekolah langsung di sini atau unduh untuk disimpan.</p>
                                        </div>
                                        <div className="grid gap-3 mb-8">
                                            {handbookChapters.map((chapter) => (
                                                <button key={chapter.id} onClick={() => setSelectedChapter(chapter)} className="flex items-center justify-between p-4 rounded-xl border border-yps-border hover:bg-yps-lightGreen hover:border-yps-green transition group text-left bg-white">
                                                    <span className="font-medium text-yps-black group-hover:text-yps-green">{chapter.title}</span>
                                                    <div className="text-gray-300 group-hover:text-yps-green"><Icons.ChevronRight/></div>
                                                </button>
                                            ))}
                                        </div>
                                        <div className="flex flex-col md:flex-row justify-center gap-4 border-t border-yps-border pt-6">
                                            <a href={DRIVE_LINK} target="_blank" rel="noopener noreferrer" className="text-white px-8 py-3 rounded-lg font-bold hover:bg-opacity-90 transition flex items-center justify-center gap-2 shadow-lg hover:shadow-xl transform active:scale-95 bg-yps-green">
                                                <Icons.Download/> Download File PDF Asli
                                            </a>
                                        </div>
                                        <p className="text-xs text-center text-gray-400 mt-4">*Link ini akan membuka file PDF resmi di Google Drive.</p>
                                    </div>
                                )}
                            </div>
                        );
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen pb-20 md:pb-0 bg-yps-bg text-yps-black font-poppins">
                    <header className="bg-white shadow-sm sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div>
                                    <h1 className="font-bold text-lg leading-tight text-yps-green">SMP YPS SINGKOLE</h1>
                                    <p className="text-xs text-gray-500">Portal Tata Tertib</p>
                                </div>
                            </div>
                            <nav className="hidden md:flex gap-6">
                                <button onClick={() => setActiveTab('home')} className={`font-medium transition ${activeTab === 'home' ? 'text-yps-green' : 'text-gray-500 hover:text-yps-green'}`}>Beranda</button>
                                <button onClick={() => setActiveTab('walikelas')} className={`font-medium transition ${activeTab === 'walikelas' ? 'text-yps-green' : 'text-gray-500 hover:text-yps-green'}`}>Wali Kelas</button>
                                <button onClick={() => setActiveTab('sekolah')} className={`font-medium transition ${activeTab === 'sekolah' ? 'text-yps-green' : 'text-gray-500 hover:text-yps-green'}`}>Sekolah</button>

                                <button onClick={() => {setActiveTab('home'); setIsMenuOpen(false)}} className="block w-full text-left p-2 rounded hover:bg-gray-50">Beranda</button>
                                <button onClick={() => {setActiveTab('walikelas'); setIsMenuOpen(false)}} className="block w-full text-left p-2 rounded hover:bg-gray-50">Wali Kelas</button>

                            </div>
                        )}

                    <main className="max-w-4xl mx-auto px-4 py-8">

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-between z-40">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-yps-green' : 'text-gray-400'}`}><Icons.BookOpen/><span className="text-xs">Home</span></button>
                        <button onClick={() => setActiveTab('walikelas')} className={`flex flex-col items-center gap-1 ${activeTab === 'walikelas' ? 'text-yps-green' : 'text-gray-400'}`}><Icons.Users/><span className="text-xs">Kelas</span></button>
                        <button onClick={() => setActiveTab('sekolah')} className={`flex flex-col items-center gap-1 ${activeTab === 'sekolah' ? 'text-yps-green' : 'text-gray-400'}`}><Icons.ShieldAlert/><span className="text-xs">Sekolah</span></button>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
